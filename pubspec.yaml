name: chooser
description: A new Flutter project.
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <3.29.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.1
  smooth_page_indicator: ^1.2.1
  video_player: ^2.9.3
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/welcome/
  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/Mulish-Light.ttf
        - asset: assets/fonts/Mulish-SemiBold.ttf
